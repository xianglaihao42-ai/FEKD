[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fekd"
version = "0.2.0"
description = "Functional and evidential consistency knowledge distillation"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0", "torchvision==0.23.0", "numpy==2.2.6", "Pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["fekd*"]

[tool.black]
line-length = 100
target-version = ["py310"]
